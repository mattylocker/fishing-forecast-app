<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Fishing Forecast</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>

	<main class="app">
		<section class="hero">
			<h1>Fishing Forecast</h1>
			<p>Enter today’s conditions and get a simple fishing recommendation.</p>
		</section>

		<section class="card">
			<label for="locationInput">Location</label>
			<input type="text" id="locationInput" placeholder="Example: Tampa, FL">

			<label for="waterTempInput">Water Temperature (°F)</label>
			<input type="number" id="waterTempInput" placeholder="Example: 68">

			<label for="clarityInput">Water Clarity</label>
			<select id="clarityInput">
				<option value="clear">Clear</option>
				<option value="stained">Stained</option>
				<option value="muddy">Muddy</option>
			</select>

			<button id="forecastBtn">Get Forecast</button>
		</section>

		<section class="card result-card" id="resultCard">
			<h2>Today’s Fishing Forecast</h2>
			<div id="weatherOutput"></div>
			<div id="recommendationOutput"></div>
		</section>
	</main>

	<script src="app.js"></script>
</body>
</html>
